# ---------------------------------------------------------------------------
# File select screens: <English text> = <translation>. Drawn with the US
# font, so accents are dropped; a translation cannot be longer than the
# original row (extra letters are cut).
[fileselect]
PLAYER SELECT = ELIGE PARTIDA
COPY PLAYER = COPIAR
ERASE PLAYER = BORRAR
QUIT = FIN
REGISTER YOUR NAME = ESCRIBE TU NOMBRE
WHICH PLAYER DO YOU WANT = QUE PARTIDA QUIERES
TO ERASE ? = BORRAR?
< > END = < >   FIN
< > END < > END = < >   FIN     < >   FIN
(WHICH?) = (CUAL?)
(TO WHICH?) = (A CUAL?)
COPY OK = COPIAR
ERASE THIS PLAYER = BORRAR PARTIDA
