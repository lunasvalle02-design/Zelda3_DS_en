# Zelda3 DS - language definition
# See lang/README.md for the format.

[language]
# Code used in zelda3.ini (Language = es) and in the asset file.
code = es
# Name shown in the settings menu (A-Z, digits, spaces and the accented
# letters supported by the bottom-screen font).
name = ESPAÑOL

# Extra dialogue glyphs, generated from the US font extracted from your ROM.
#   <char> = <base char> <operation>
# Operations: acute, grave, circumflex, tilde, diaeresis, cedilla,
#             flip (upside down), rotate (180 degrees).
[glyphs]
á = a acute
é = e acute
í = i acute
ó = o acute
ú = u acute
ü = u diaeresis
ñ = n tilde
Á = A acute
É = E acute
Í = I acute
Ó = O acute
Ú = U acute
Ü = U diaeresis
Ñ = N tilde
¡ = ! flip
¿ = ? rotate
